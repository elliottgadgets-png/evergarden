<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נצח — האתר שלעולם לא נגמר</title>

<body>

<div id="preloader" aria-hidden="true">
  <div id="load-count">0</div>
</div>

<canvas id="word"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="cursor-dot" aria-hidden="true"></div>
<div id="cursor-ring" aria-hidden="true"></div>

<header id="frame">

  <div class="frame-status"><span id="status-dot"></span>חי</div>
</header>

<main id="scroll-content">
  <section class="panel" data-ch="0">
    <p class="cap cap-hero reveal-line">אתר שלעולם לא נגמר<span class="cap-sep">·</span>גללו</p>
  </section>
  <section class="panel" data-ch="1">
    <p class="cap reveal-line">כל גלילה מחייה את האותיות מחדש</p>
  </section>
  <section class="panel" data-ch="2">
    <p class="cap reveal-line">הזיזו את הסמן — האותיות מרגישות אתכם</p>
  </section>
  <section class="panel" data-ch="3">
    <p class="cap reveal-line">ובסוף, הכל הופך לאור</p>
  </section>
  <section class="panel panel-outro" data-ch="4">
    <div class="outro-inner">
      <p class="outro-big reveal-line">האתר הזה<br>לעולם לא יהיה גמור.</p>

      <div class="outro-meta reveal-line">
        <span class="om-item">SEED 002 — נצח</span>
        <a class="om-item om-link" href="https://github.com/elliottgadgets-png/evergarden" target="_blank" rel="noopener">הקוד פתוח ↗</a>
      </div>
    </div>
  </section>
